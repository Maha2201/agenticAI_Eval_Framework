[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-eval"
version = "0.1.0"
description = "Application-agnostic evaluation framework for agentic and multi-agent AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Paktolus QA" }]
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# DeepEval powers the DeepEval-backed metrics and LLM judges. It is optional so the
# core and all deterministic metrics run without it (and without any API key).
deepeval = ["deepeval==4.2.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
agentic-eval = "agentic_eval.cli:main"

[project.entry-points."agentic_eval.plugins"]
# External packages can register plugins here, e.g.
# my_plugins = "my_package.plugins"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
